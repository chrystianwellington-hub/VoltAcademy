<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>VoltAcademy Comandos Elétricos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen workbench — dark brand toolbar, component palette left, drawing sheet center, inspector right; palette/inspector become drawers on phones. */
:root {
  --bg: #E7E5DE; --panel: #F7F6F1; --panel-2: #EEECE5; --line: #D5D1C5; --fg: #1F2119; --muted: #67685C;
  --brand: #26281F; --brand-2: #33362A; --brand-fg: #F2EAD3; --brand-muted: #B9B29C;
  --gold: #C9962F; --gold-ink: #7E5B12; --gold-soft: #F3E4BF;
  --live: #CF3F25; --neutral: #2D6BB0; --ok: #2E8B57; --warn: #B7791F;
  --paper: #FCFBF6; --ink: #2A2C24; --grid: #E6E2D6; --frame: #9A9585;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15160F; --panel: #1E2018; --panel-2: #262920; --line: #363929; --fg: #ECE8DA; --muted: #A29E8A;
  --brand: #101109; --brand-2: #23251B; --gold-ink: #E8BE62; --gold-soft: #3A3220; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15160F; --panel: #1E2018; --panel-2: #262920; --line: #363929; --fg: #ECE8DA; --muted: #A29E8A;
  --brand: #101109; --brand-2: #23251B; --gold-ink: #E8BE62; --gold-soft: #3A3220; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
/* Toolbar */
.bar { background: var(--brand); color: var(--brand-fg); display: flex; align-items: center; gap: 10px;
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: #2F3127; display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; font-size: 15px; }
.brand small { display: block; color: var(--brand-muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.bar .grow { flex: 1; min-width: 8px; }
.tb { display: flex; align-items: center; gap: 4px; }
.ib { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid #45483A; background: var(--brand-2);
  color: var(--brand-fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.ib:hover { border-color: var(--gold); }
.ib[disabled] { opacity: .4; cursor: default; }
.ib svg { width: 17px; height: 17px; }
.run { height: 36px; padding: 0 16px; border-radius: 9px; border: 0; background: var(--ok); color: #fff; font-weight: 600;
  letter-spacing: .06em; display: inline-flex; align-items: center; gap: 8px; }
.run.on { background: var(--live); }
.clock { font-family: var(--font-mono); background: #15160F; color: #F2EAD3; border: 1px solid #45483A; border-radius: 8px;
  padding: 7px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.zoomv { font-family: var(--font-mono); font-size: 12px; min-width: 44px; text-align: center; color: var(--brand-muted); }

/* Body */
.main { display: grid; grid-template-columns: 236px 1fr 264px; min-height: 0; }
.pane { background: var(--panel); min-height: 0; overflow: auto; }
.pal { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.insp { border-left: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.h { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tool { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 4px; font-size: 12px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tool svg { width: 18px; height: 18px; }
.tool.act { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-ink); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.sw.act { box-shadow: 0 0 0 2px var(--gold); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.part { border: 1px solid var(--line); background: var(--paper); color: #2A2C24; border-radius: 8px; padding: 4px 4px 6px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 11.5px; line-height: 1.2; text-align: center; min-height: 86px; }
.part:hover { border-color: var(--gold); }
.part.act { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.part svg { width: 54px; height: 54px; flex: none; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); overflow: hidden; touch-action: none; }
#cv { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--live); color: #fff;
  padding: 9px 14px; border-radius: 9px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.hint { position: absolute; left: 12px; bottom: 12px; right: 12px; pointer-events: none; display: flex; }
.hint span { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); max-width: 100%; }

.status { background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; min-width: 0; overflow-x: auto;
  padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); font-size: 12.5px; }
.chip { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.chip.on .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.chip.warn { border-color: var(--warn); color: var(--warn); }

/* Inspector */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 11px; font-size: 13px; }
.btn:hover { border-color: var(--gold); }
.btn.pri { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
.btn.danger { color: var(--live); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.title-lg { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.mono { font-family: var(--font-mono); }
.list.help li { display: block; line-height: 1.5; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(15,16,10,.55); display: grid; place-items: center; z-index: 50;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ex { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.ex .card { display: flex; flex-direction: column; gap: 8px; }
.ex h4 { margin: 0; font-size: 15px; }
.ex p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
textarea.json { font-family: var(--font-mono); font-size: 12px; min-height: 220px; }

.only-m { display: none; }
@media (max-width: 1100px) { .main { grid-template-columns: 220px 1fr; } .insp { display: none; } .insp.open { display: flex; } }
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; }
  .pal, .insp { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 62%; border: 0; border-top: 1px solid var(--line);
    box-shadow: 0 -10px 30px rgba(0,0,0,.2); border-radius: 14px 14px 0 0; display: none;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .pal.open, .insp.open { display: flex; }
  .grid2 { grid-template-columns: repeat(3, 1fr); }
  .only-m { display: inline-flex; }
  .hide-m { display: none !important; }
  .brand > div:last-child, .zoomv, #bZoomIn, #bZoomOut, #bFit { display: none; }
  .bar { gap: 6px; }
  .run { padding: 0 12px; }
  .clock { padding: 7px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#E2B656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 8-12h-6z"/></svg>
      </div>
      <div><b>VOLTACADEMY</b><small>Comandos elétricos</small></div>
    </div>
    <button class="ib only-m" id="bPal" aria-label="Componentes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="grow"></div>
    <button class="run" id="bRun"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>SIMULAR</span></button>
    <span class="clock" id="clock">00:00.0</span>
    <div class="grow hide-m"></div>
    <div class="tb">
      <button class="ib hide-m" id="bUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ib hide-m" id="bRedo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="ib" id="bZoomOut" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
      <span class="zoomv" id="zoomv">100%</span>
      <button class="ib" id="bZoomIn" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="bFit" title="Enquadrar folha" aria-label="Enquadrar folha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" id="bEx" title="Circuitos de exemplo e aulas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7l10-4 10 4-10 4z"/><path d="M6 9v5c3 2 9 2 12 0V9"/></svg><span class="hide-m">Exemplos</span></button>
      <button class="ib hide-m" id="bFile" title="Salvar ou abrir projeto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span>Projeto</span></button>
      <button class="ib only-m" id="bInsp" aria-label="Propriedades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </header>

  <div class="main">
    <aside class="pane pal" id="pal">
      <section>
        <p class="h">Ferramentas</p>
        <div class="tools">
          <button class="tool act" data-mode="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 3 14 8-6 2-2 6z"/></svg>Selecionar</button>
          <button class="tool" data-mode="wire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5 12 12h0V7h5.5"/></svg>Fio</button>
          <button class="tool" data-mode="pan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg>Mover tela</button>
        </div>
        <div class="swatches" id="swatches" aria-label="Cor do fio"></div>
      </section>
      <section id="palette"></section>
    </aside>

    <div class="stage" id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.1" fill="#D9D4C6"/></pattern>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="banner" id="banner" hidden></div>
      <div class="hint"><span id="hint"></span></div>
    </div>

    <aside class="pane insp" id="insp"></aside>
  </div>

  <footer class="status" id="status"></footer>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(() => {
'use strict';
const PLATFORM = 'VoltAcademy';
const SHEET = { w: 1600, h: 1000 };
const GRID = 20;
const WIRE_COLORS = [['#C0392B','Vermelho'],['#22231C','Preto'],['#2D6BB0','Azul'],['#2E8B57','Verde'],['#D9822B','Laranja'],['#C9A227','Amarelo'],['#7D4CB0','Violeta'],['#8E8A7A','Cinza']];
const LAMP_COLORS = { verde: '#35B26B', vermelho: '#E2442F', amarelo: '#F2C230', azul: '#3D86E0', branco: '#F4F1E6' };
const PHASES = ['L1', 'L2', 'L3'];

// =====================================================================
// IEC 60617 symbol helpers. Convention: vertical current path, fixed
// terminal leads, moving contact (blade) pivoting on the lower lead,
// actuators drawn on the left, joined by a dashed mechanical link.
// =====================================================================
const L = (x1, y1, x2, y2, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${extra}/>`;
const T = (x, y, s, cls = 'it', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${s}</text>`;
const dash = 'stroke-dasharray="3 2.5"';
// Make contact (NA, S00227): blade leans left, open.
function no(x = 0, act = false, cup = false, cross = false) {
  let s = L(x, -40, x, -14) + L(x, 14, x, 40);
  s += act ? L(x, 14, x, -14) : L(x, 14, x - 12, -11);
  if (cup) s += `<path d="M${x - 4} -14 A4 4 0 0 0 ${x + 4} -14" fill="none"/>`;      // contactor function (S00284)
  if (cross) s += L(x - 4, -18, x + 4, -10) + L(x - 4, -10, x + 4, -18);             // circuit-breaker function (S00287)
  return s;
}
// Break contact (NF, S00229): fixed contact bent right, blade crosses it at rest.
function nc(x = 0, act = false) {
  let s = L(x, -40, x, -14) + L(x, -14, x + 8, -14) + L(x, 14, x, 40);
  s += act ? L(x, 14, x - 12, -11) : L(x, 14, x + 10, -17);
  return s;
}
// Change-over (comum NA/NF, S00230): common on top, NA lower-left, NF lower-right.
function co(act = false) {
  let s = L(0, -40, 0, -14) + L(-14, 40, -14, 14) + L(14, 40, 14, 14) + L(14, 14, 7, 14);
  s += act ? L(0, -14, -14, 14) : L(0, -14, 9, 16);
  return s;
}
const link = (x1 = -6, x2 = -24, y = 0) => L(x1, y, x2, y, dash);
// Operators
const opPush = (x = -24) => L(x, -7, x, 7) + L(x, -7, x + 4, -7) + L(x, 7, x + 4, 7);                 // push, spring return (S00256): E
const opMushroom = (x = -24) => `<path d="M${x} -9 A9 9 0 0 0 ${x} 9 Z" fill="currentColor"/>` + L(x + 3, -4, x + 7, 0) + L(x + 3, 4, x + 7, 0); // mushroom head + latch (S00258/S00259)
const opTurn = (x = -24) => L(x - 4, -7, x, -7) + L(x, -7, x, 7) + L(x, 7, x + 4, 7);                // turn/rotary (S00257)
const opThermal = (x = -24) => `<path d="M${x - 10} 5 V-5 H${x - 3} V5 H${x}" fill="none"/>`;       // thermal effect (S00151)
const opDelay = (x = -16) => `<path d="M${x} -7 A7 7 0 0 0 ${x} 7" fill="none"/>` + L(x - 7, 0, x, 0); // delayed operation (S00249)
const opMagThermal = (x = -24) => `<rect x="${x - 16}" y="-9" width="16" height="18" fill="none"/>` + T(x - 8, 3, 'I&gt;', 'it sm') ; // overcurrent release
function proxBox(kind, act, nf) {
  // Proximity switch (S00360): box, rhombus actuator, inductive "Fe" or capacitive plates
  let s = `<rect x="-34" y="-24" width="46" height="48" fill="none"/>`;
  s += `<path d="M-24 -18 L-17 -11 L-24 -4 L-31 -11 Z" fill="none"/>` + L(-27, -11, -21, -11);
  s += kind === 'cap' ? L(-29, 9, -29, 17) + L(-25, 9, -25, 17) + L(-33, 13, -29, 13) + L(-25, 13, -21, 13) : T(-24, 18, 'Fe', 'it sm');
  s += L(0, -40, 0, -24) + L(0, 24, 0, 40);
  s += nf ? L(0, -24, 0, -12) + L(0, -12, 6, -12) + L(0, 24, 0, 12) + (act ? L(0, 12, -8, -9) : L(0, 12, 8, -14))
          : L(0, -24, 0, -12) + L(0, 24, 0, 12) + (act ? L(0, 12, 0, -12) : L(0, 12, -8, -9));
  s += L(-17, -11, -6, -11, dash);
  return s;
}
const coilBox = (on, x = 0) => `<rect x="${x - 18}" y="-12" width="36" height="24" fill="${on ? 'var(--gold)' : 'none'}" ${on ? 'filter="url(#glow)"' : ''}/>`;
const P2 = { a: [0, -40], b: [0, 40] };
const two = act => act ? [['a', 'b']] : [];
const twoNC = act => act ? [] : [['a', 'b']];
const BOX2 = [-34, -44, 68, 88];

// =====================================================================
// Component library
//  terms: name -> [x,y] (local), nums: name -> terminal marking
//  act(c,s): actuated?  pairs(act,c,s): terminal pairs closed
//  src(c,s): {term: potential}   loads: [[t1,t2,kind]]
//  inter: 'push' | 'toggle' | 'trip' (interaction during simulation)
// =====================================================================
const actPush = (c, s) => s.pressed.has(c.id);
const actToggle = (c, s) => s.toggled.has(c.id);
const actTrip = (c, s) => s.tripped.has(c.tag);
const actCoil = (c, s) => !!s.coils[c.tag];
const actTimer = (c, s) => !!s.timerDone[c.tag];

const TYPES = {
  // ---------------- Alimentação ----------------
  fase: { name: 'Fase (L)', cat: 'Alimentação', pre: 'L', notag: true, terms: { a: [0, 20] }, nums: {}, box: [-26, -14, 52, 40],

    if (c.type === 'cabo_out' && !ins.has(c.tag)) out.push(`${c.tag}: segmento OUT sem um IN com a mesma tag`);

}

// ---------- Palette ----------
function buildPalette() {
  $('#swatches').innerHTML = WIRE_COLORS.map(([c, n]) => `<button class="sw${c === ui.wireColor ? ' act' : ''}" data-color="${c}" title="Fio ${n}" aria-label="Fio ${n}" style="background:${c}"></button>`).join('');
  let h = '';
  for (const cat of CATS) {
    const items = Object.entries(TYPES).filter(([, T0]) => T0.cat === cat);
    h += `<p class="h" style="margin-top:4px">${cat}</p><div class="grid2">` + items.map(([k, T0]) => {
      const [bx, by, bw, bh] = T0.box, m = 6, side = Math.max(bw, bh) + 2 * m;
      const vb = `${bx + bw / 2 - side / 2} ${by + bh / 2 - side / 2} ${side} ${side}`;
      return `<button class="part" data-part="${k}" title="${T0.name}"><svg viewBox="${vb}"><g class="sym">${T0.draw({ color: 'verde' }, {})}</g></svg>${T0.name.replace(' (retardo na energização)', '')}</button>`;
    }).join('') + '</div>';

  $('#palette').innerHTML = h;
}

// ---------- Pointer handling ----------
function toWorld(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [(p.x - ui.px) / ui.zoom, (p.y - ui.py) / ui.zoom];
}
let drag = null;
const touches = new Map(); let pinch = null;
function orth(a, b) { return Math.abs(b[0] - a[0]) > Math.abs(b[1] - a[1]) ? [b[0], a[1]] : [a[0], b[1]]; }
svg.addEventListener('pointerdown', ev => {
  touches.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    if (drag && drag.kind === 'press') { sim.pressed.clear(); solve(); }
    drag = null; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; return;
  }
  const p = toWorld(ev);
  const termEl = ev.target.closest('[data-term]'), compEl = ev.target.closest('[data-comp]'), wireEl = ev.target.closest('[data-wire]');
  if (sim.running) {
    if (compEl) {
      const c = compById(compEl.dataset.comp), T0 = TYPES[c.type];
      if (T0.inter === 'push') { sim.pressed.add(c.id); solve(); render(); if (sim.short) { stopSim(shortMsg()); return; } svg.setPointerCapture(ev.pointerId); drag = { kind: 'press' }; return; }
      if (T0.inter) { interact(c); return; }
      ui.sel = { kind: 'comp', id: c.id }; render(); return;
    }
    drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, px: ui.px, py: ui.py }; svg.setPointerCapture(ev.pointerId); return;
  }
  if (ui.placing) {
    const c = addComp(ui.placing, p[0], p[1]); ui.sel = { kind: 'comp', id: c.id };
    if (!ev.shiftKey) ui.placing = null;
    commit(); render(); return;
  }
  if (ui.mode === 'wire') {
    if (termEl) {
      const [cid, t] = termEl.dataset.term.split('|');
      if (!ui.wireStart) { ui.wireStart = { c: cid, t }; ui.wirePts = []; ui.cursor = p; render(); return; }
      if (ui.wireStart.c === cid && ui.wireStart.t === t) { ui.wireStart = null; render(); return; }
      const same = w => (w.a.c === ui.wireStart.c && w.a.t === ui.wireStart.t && w.b.c === cid && w.b.t === t) || (w.b.c === ui.wireStart.c && w.b.t === ui.wireStart.t && w.a.c === cid && w.a.t === t);
      if (!doc.wires.some(same)) { addWire(ui.wireStart, { c: cid, t }, ui.wireColor, ui.wirePts.map(q => [...q])); commit(); }
      ui.wireStart = null; ui.wirePts = []; render(); return;
    }
    if (ui.wireStart) { const last = ui.wirePts.length ? ui.wirePts[ui.wirePts.length - 1] : termPos(compById(ui.wireStart.c), ui.wireStart.t); ui.wirePts.push(orth(last, [snap(p[0]), snap(p[1])])); render(); return; }
  }
  if (ui.mode === 'select') {
    if (compEl) {
      const c = compById(compEl.dataset.comp); ui.sel = { kind: 'comp', id: c.id };
      drag = { kind: 'move', id: c.id, ox: p[0] - c.x, oy: p[1] - c.y, moved: false }; svg.setPointerCapture(ev.pointerId); render(); return;
    }
    if (wireEl) { ui.sel = { kind: 'wire', id: wireEl.dataset.wire }; render(); return; }
    ui.sel = null; render();
  }
  drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, px: ui.px, py: ui.py }; svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev => {
  if (touches.has(ev.pointerId)) touches.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pinch && touches.size === 2) {
    const [a, b] = [...touches.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (d > 0 && pinch.d > 0) { zoomAt(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d; }
    return;
  }

  if (drag && drag.kind === 'move') {

    if (nx !== c.x || ny !== c.y) { c.x = Math.max(40, Math.min(SHEET.w - 40, nx)); c.y = Math.max(40, Math.min(SHEET.h - 40, ny)); drag.moved = true; render(); }
    return;
  }

});
const endDrag = ev => {

};
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX, ev.clientY); }, { passive: false });
function zoomAt(k, cx, cy) {

  ui.zoom = Math.max(0.2, z); ui.px = (r.width - SHEET.w * ui.zoom) / 2; ui.py = (r.height - SHEET.h * ui.zoom) / 2; render();

document.addEventListener('keydown', ev => {

  else if ((ev.key === 'r' || ev.key === 'R') && ui.sel && ui.sel.kind === 'comp' && !sim.running) { const c = compById(ui.sel.id); c.rot = ((c.rot || 0) + 90) % 360; commit(); render(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !sim.running) { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y' && !sim.running) { ev.preventDefault(); redo(); }
