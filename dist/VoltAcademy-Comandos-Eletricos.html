<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>VoltAcademy Comandos Elétricos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: industrial HMI workbench — white command bar on top with icon+label actions, colored category rail + folder drawer on the left,
   drawing sheet with sheet tabs in the center, inspector + vertical tool column on the right, section navigation bar at the bottom. */
:root {
  --bg: #ECEEF1; --surface: #FFFFFF; --surface-2: #F5F6F8; --surface-3: #E9ECF0; --line: #DDE1E6; --fg: #1B1E23; --muted: #6A717C;
  --accent: #B8861E; --accent-soft: #FBF1DC; --accent-ink: #8A6210; --brand: #26281F; --brand-gold: #D9A93B;
  --run: #1F9D55; --stop: #D23A2A; --warn: #B7791F; --ok: #1F9D55;
  --live: #CF3F25; --neutral: #2D6BB0;
  --c-power: #E2553E; --c-cmd: #2F7DE1; --c-relay: #EE9A1D; --c-prot: #23A26D; --c-load: #12A0B3;
  --paper: #FCFBF7; --ink: #2A2C24; --frame: #9A9585; --gold: #C9962F; --gold-soft: #FBF1DC;
  --series-1: #257de0; --series-2: #f47230; --series-3: #00b894; --critical: #dc3c3d; --good: #0aac23;
  --shadow: 0 1px 2px rgba(20,24,30,.06), 0 4px 14px rgba(20,24,30,.06);
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --surface: #1B1E24; --surface-2: #22262D; --surface-3: #2A2F37; --line: #333944; --fg: #E8EAED; --muted: #9AA1AC;
  --accent: #E0AE46; --accent-soft: #3A3120; --accent-ink: #F0C46A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1B1E24; --surface-2: #22262D; --surface-3: #2A2F37; --line: #333944; --fg: #E8EAED; --muted: #9AA1AC;
  --accent: #E0AE46; --accent-soft: #3A3120; --accent-ink: #F0C46A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button[disabled] { cursor: default; opacity: .38; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); } .small { font-size: 12.5px; } .muted { color: var(--muted); }
.h { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 4px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* ---- Top command bar ---- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; min-width: 0;
  padding-block: 6px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; }
.brand b { display: block; font-family: var(--font-display); font-weight: 800; letter-spacing: .05em; font-size: 16px; line-height: 1.1; }
.brand small { display: block; color: var(--muted); font-size: 12px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; min-width: 0; }
.acts { display: flex; align-items: stretch; gap: 2px; }
.tbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 8px; border-radius: 10px; color: var(--fg); font-size: 12px; }
.tbtn svg { width: 24px; height: 24px; }
.tbtn:hover:not([disabled]) { background: var(--surface-2); }
.tbtn.runb { color: var(--run); }
.tbtn.runb.on { color: var(--stop); }
.tbtn.runb .lbl { font-weight: 600; }
.clock { align-self: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.sep { width: 1px; background: var(--line); margin: 8px 4px; }

/* ---- Views ---- */
.views { min-height: 0; position: relative; }
.view { height: 100%; min-height: 0; }
#vDiagram { display: grid; grid-template-columns: 76px 250px 1fr auto 60px; }
.scrollview { overflow: auto; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scrollview > * { max-width: 1180px; margin-left: auto; margin-right: auto; }

/* rail + drawer (folders) */
.rail { background: var(--surface-3); display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; overflow-y: auto; }
.railb { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px; border-radius: 10px; font-size: 11px; line-height: 1.2; text-align: center; color: var(--muted); }
.railb:hover { background: var(--surface-2); }
.railb.act { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.ricon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
.ricon svg { width: 19px; height: 19px; }
.drawer { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.drawer .dh { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; }
.search input { border: 0; background: none; padding: 8px 0; width: 100%; outline: none; }
#folders { overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.folder summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.folder summary::-webkit-details-marker { display: none; }
.folder summary:hover { background: var(--surface-2); }
.folder summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); margin-left: 4px; transition: transform .15s; }
.folder[open] summary::after { transform: rotate(45deg); }
.fic { width: 18px; height: 18px; flex: none; }
.folder .cnt { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; }
.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 0 10px; }
.part { border: 1px solid var(--line); background: var(--paper); color: #2A2C24; border-radius: 9px; padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; line-height: 1.2; text-align: center; min-height: 92px; }
.part:hover { border-color: var(--accent); }
.part.act { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.part svg { width: 52px; height: 52px; flex: none; }

/* stage */
.stagewrap { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
.sheetbar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 6px 10px; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: thin; }
.tab { white-space: nowrap; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { background: var(--surface-2); color: var(--fg); }
.tab.act { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.tabn { font-family: var(--font-mono); font-size: 12px; }
.tabc { font-size: 11px; background: var(--surface-3); color: var(--muted); border-radius: 999px; padding: 0 6px; }
.sheetacts { display: flex; gap: 6px; flex: none; }
.sbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 500; }
.sbtn svg { width: 15px; height: 15px; }
.sbtn:hover { border-color: var(--accent); }
.sbtn.pri { background: var(--brand); color: #F3E9CF; border-color: var(--brand); }
.sbtn.del { color: var(--stop); }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; background: var(--bg); }
#cv { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.hint { position: absolute; left: 12px; bottom: 12px; right: 12px; pointer-events: none; display: flex; }
.hint span { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); box-shadow: var(--shadow); max-width: 100%; }
.status { background: var(--surface); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 6px 12px; font-size: 12.5px; min-width: 0; }
.pill { font-weight: 600; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.pill.run { background: rgba(31,157,85,.14); color: var(--run); }
.chip { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.chip.on .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.banner { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); background: var(--stop); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

/* tools column */
.tools { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; overflow-y: auto; position: relative; }
.tool { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--fg); background: var(--surface); }
.tool svg { width: 22px; height: 22px; }
.tool:hover:not([disabled]) { border-color: var(--accent); }
.tool.act { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.tsep { width: 28px; height: 1px; background: var(--line); margin: 2px 0; }
#wireSw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.zoomv { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.colorpop { position: fixed; right: 70px; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: grid; grid-template-columns: repeat(4, 26px); gap: 8px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw.act { box-shadow: 0 0 0 2px var(--accent); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }

/* inspector */
.insp { width: 0; overflow: hidden; background: var(--surface); border-left: 1px solid var(--line); }
.insp.open { width: 280px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.insp:not(.open) > * { display: none; }
.insph { display: flex; justify-content: space-between; align-items: center; }
.insph .h { margin: 0; }
.x { width: 28px; height: 28px; border-radius: 8px; font-size: 20px; line-height: 1; color: var(--muted); }
.x:hover { background: var(--surface-2); color: var(--fg); }
.title-lg { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0; text-wrap: balance; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--brand); color: #F3E9CF; border-color: var(--brand); }
.btn.lg { padding: 11px 16px; font-size: 14px; }
.btn.danger { color: var(--stop); }
.btn.dangerfill { background: var(--stop); color: #fff; border-color: var(--stop); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); }
.card.warnc { border-color: var(--warn); }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.list.help li { display: block; line-height: 1.5; }
.lnk { color: var(--accent-ink); font-weight: 500; text-align: left; }
.lnk:hover { text-decoration: underline; }
.kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }

/* ---- Bottom navigation ---- */
.bottom { background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); align-items: stretch;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px 10px; font-size: 13px; color: var(--fg); border-top: 3px solid transparent; }
.nav svg { width: 28px; height: 28px; color: var(--muted); }
.nav:hover { background: var(--surface-2); }
.nav.act { color: var(--accent-ink); border-top-color: var(--accent); }
.nav.act svg { color: var(--accent); }
.nav.home b { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .05em; color: var(--fg); line-height: 28px; white-space: nowrap; }
.nav.home .mi { display: none; }
.nav.home b span { color: var(--accent); }

/* ---- Other views ---- */
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.vhead h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; text-wrap: balance; }
section { margin-bottom: 22px; }
.bigrun { background: var(--run); color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 12px; font-size: 15px; box-shadow: var(--shadow); }
.bigrun.on { background: var(--stop); }
.opgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.opbtn { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); min-height: 96px; user-select: none; -webkit-user-select: none; touch-action: none; }
.opbtn svg { width: 64px; height: 64px; flex: none; background: var(--paper); border-radius: 10px; }
.opbtn .sym { stroke: #2A2C24; stroke-width: 2.4; fill: none; color: #2A2C24; stroke-linecap: round; }
.opbtn span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opbtn b { font-size: 18px; } .opbtn small { color: var(--muted); }
.opbtn.act { border-color: var(--accent); background: var(--accent-soft); }
.opbtn.trip.act { border-color: var(--stop); }
.opbtn:not([disabled]):hover { border-color: var(--accent); }
.lampgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.lamp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lamp.wide { grid-column: span 2; }
.lamp small { color: var(--muted); text-align: center; }
.bulb { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface-2); }
.bulb.on { background: var(--lc); border-color: var(--lc); box-shadow: 0 0 22px var(--lc); }
.coilind { width: 46px; height: 32px; border-radius: 6px; border: 3px solid var(--line); }
.coilind.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px var(--accent); }
.motorind { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--muted); }
.motorind.cw, .motorind.ccw { border-color: var(--run); color: var(--run); border-top-color: transparent; animation: spin 1s linear infinite; }
.motorind.ccw { animation-direction: reverse; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile small { color: var(--muted); } .tile b { font-size: 17px; }
.tile.on { border-left-color: var(--run); } .tile.warn { border-left-color: var(--stop); }
.events { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 50vh; overflow: auto; }
.events li { display: flex; gap: 14px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.events li:last-child { border-bottom: 0; }
.events .mono { color: var(--muted); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
.ok { color: var(--run); font-weight: 600; }
.hero { background: var(--brand); color: #F3E9CF; border-radius: 18px; padding: 28px; margin-bottom: 24px; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 5vw, 44px); margin: 0 0 8px; text-wrap: balance; }
.hero .eyebrow { color: var(--brand-gold); }
.hero .lead { max-width: 62ch; color: #D6CFBC; line-height: 1.5; margin: 0 0 18px; }
.hero .btn { background: #34372B; color: #F3E9CF; border-color: #4A4D3F; }
.hero .btn.pri { background: var(--brand-gold); color: #1F2119; border-color: var(--brand-gold); }
.exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.excard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.thumb { width: 100%; height: auto; aspect-ratio: 16 / 10; display: block; border-bottom: 1px solid var(--line); background: var(--paper); }
.exb { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.exb h3 { margin: 0; font-size: 16px; }
.exb p { margin: 0; line-height: 1.45; }
.exb .btn { margin-top: auto; align-self: flex-start; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(12,14,18,.5); display: grid; place-items: center; z-index: 70;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.msheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
textarea.json { font-family: var(--font-mono); font-size: 12px; min-height: 200px; }
.helpol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; line-height: 1.5; }

/* ---- Drawing (SVG) ---- */
#cv .sym, .part .sym, .thumb .sym { stroke: #2A2C24; stroke-width: 2; fill: none; color: #2A2C24; stroke-linecap: round; stroke-linejoin: round; }
.part .sym { stroke-width: 2.4; }
.sym .it { font: 600 11px var(--font-body); fill: #2A2C24; stroke: none; }
.sym .it.sm { font-size: 9px; } .sym .it.big { font-size: 16px; font-weight: 700; }
.sym .it.warn { fill: var(--live); } .sym .it.okt { fill: var(--ok); }

<script>
(() => {
'use strict';
const PLATFORM = 'VoltAcademy';
const SHEET = { w: 1600, h: 1000 };
const GRID = 20;
const WIRE_COLORS = [['#C0392B','Vermelho'],['#22231C','Preto'],['#2D6BB0','Azul'],['#2E8B57','Verde'],['#D9822B','Laranja'],['#C9A227','Amarelo'],['#7D4CB0','Violeta'],['#8E8A7A','Cinza']];
const LAMP_COLORS = { verde: '#35B26B', vermelho: '#E2442F', amarelo: '#F2C230', azul: '#3D86E0', branco: '#F4F1E6' };
const PHASES = ['L1', 'L2', 'L3'];

// =====================================================================
// IEC 60617 symbol helpers. Convention: vertical current path, fixed
// terminal leads, moving contact (blade) pivoting on the lower lead,
// actuators drawn on the left, joined by a dashed mechanical link.
// =====================================================================
const L = (x1, y1, x2, y2, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${extra}/>`;
const T = (x, y, s, cls = 'it', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${s}</text>`;
const dash = 'stroke-dasharray="3 2.5"';
// Make contact (NA, S00227): blade leans left, open.
function no(x = 0, act = false, cup = false, cross = false) {
  let s = L(x, -40, x, -14) + L(x, 14, x, 40);
  s += act ? L(x, 14, x, -14) : L(x, 14, x - 12, -11);
  if (cup) s += `<path d="M${x - 4} -14 A4 4 0 0 0 ${x + 4} -14" fill="none"/>`;      // contactor function (S00284)
  if (cross) s += L(x - 4, -18, x + 4, -10) + L(x - 4, -10, x + 4, -18);             // circuit-breaker function (S00287)

  let s = L(x, -40, x, -14) + L(x, -14, x + 8, -14) + L(x, 14, x, 40);

}

  let s = `<rect x="-34" y="-24" width="46" height="48" fill="none"/>`;

  $('#sheet').addEventListener('keydown', ev => { if (ev.key === 'Enter') save(); });
}

document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,textarea,select')) return;
  if (ev.key === 'Escape') { ui.placing = null; ui.wireStart = null; ui.wirePts = []; closeModal(); $('#colorPop').hidden = true; render(); return; }
  if (ui.view !== 'diagram' && ev.key !== ' ') return;
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && ui.sel) { ev.preventDefault(); deleteSel(); }
  else if (ev.key === 'r' || ev.key === 'R') rotateSel();
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); }
  else if (ev.key === ' ' && !ev.repeat) { ev.preventDefault(); sim.running ? stopSim() : startSim(); }
  else if ((ev.key === 'w' || ev.key === 'W') && !sim.running) { ui.mode = 'wire'; ui.placing = null; render(); }
  else if ((ev.key === 'v' || ev.key === 'V') && !sim.running) { ui.mode = 'select'; ui.placing = null; ui.wireStart = null; render(); }
});
window.addEventListener('pointerup', () => { if (sim.pressed.size && !drag) pressEnd(); });

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal' || ev.target.closest('[data-close]')) closeModal(); });
function loadKeepingHistory(src) {
  if (sim.running) stopSim();
  const keep = hist.stack.slice(0, hist.idx + 1); ui.sheet = null; load(src);
  hist.stack = keep.concat(hist.stack); hist.idx = hist.stack.length - 1; saveLocal(); closeModal();
  ui.view = 'diagram'; render(); requestAnimationFrame(fit);
}

}
function renumberWires() {
  const mid = w => { const P = fullPointsAny(w); return P ? P[Math.floor(P.length / 2)] : [0, 0]; };
  const ord = doc.wires.map(w => ({ w, s: sheetNo(doc, (compById(w.a.c) || {}).sheet), m: mid(w) })).sort((a, b) => a.s - b.s || a.m[0] - b.m[0] || a.m[1] - b.m[1]);
  ord.forEach((o, i) => { o.w.no = i + 1; }); commit(); render();
}
function fullPointsAny(w) { const map = new Map(doc.comps.map(c => [c.id, c])); const c = map.get(w.a.c); if (!c) return null; const rects = doc.comps.filter(x => x.sheet === c.sheet).map(x => ({ id: x.id, r: compRect(x) })); return wirePoints(w, map, rects); }
function wireRows() {
  return doc.wires.filter(w => compById(w.a.c) && compById(w.b.c)).slice().sort((a, b) => String(a.no).localeCompare(String(b.no), 'pt', { numeric: true })).map(w => {
    const P = fullPointsAny(w); let len = 0; if (P) for (let i = 0; i < P.length - 1; i++) len += Math.abs(P[i + 1][0] - P[i][0]) + Math.abs(P[i + 1][1] - P[i][1]);
    return { w, no: w.no, from: endLabel(w.a), to: endLabel(w.b), sheet: doc.sheets.find(s => s.id === compById(w.a.c).sheet)?.name || '', kind: wireKind(w), sec: wireSection(w), color: colorName(w.color), len };
  });
}
function openHelp() {
  openModal(`<div class="row" style="justify-content:space-between;align-items:center"><p class="title-lg">Como usar</p><button class="btn" data-close>Fechar</button></div>
  <ol class="helpol">
    <li><b>Componentes:</b> abra uma pasta na barra da esquerda, toque no componente e depois na folha. Segure Shift para inserir vários.</li>
    <li><b>Fios:</b> aperte num borne e arraste até outro: os bornes viram alvos verdes, o fio gruda no mais próximo e a rota é feita sozinha, desviando dos componentes. Clique no fio e arraste as alças para reposicionar. Duplo clique abre número, cor, tipo e seção do cabo.</li>
    <li><b>Folhas:</b> use Nova folha para separar força e comando. Para o fio continuar em outra folha, ponha um Segmento de cabo OUT numa folha e um IN na outra com a mesma tag. A referência "→ 2.3" indica folha 2, coluna 3.</li>
    <li><b>Contatos:</b> cada contato usa a tag da bobina que o comanda (K1, KT1). Abaixo da bobina aparecem as folhas e colunas dos contatos dela.</li>
    <li><b>Simular:</b> aperte Simular. Segure os botões; toque em chaves, sensores, disjuntores, fusíveis, fonte e relé térmico. Os fios animados mostram por onde a corrente passa.</li>
    <li><b>Operação:</b> na barra de baixo, a aba Operação vira um painel com botões grandes; Monitoramento mostra estados e o registro de eventos.</li>
  </ol>
  <p class="muted small" style="margin:0">Atalhos: <span class="kbd">Espaço</span> simula · <span class="kbd">W</span> fio · <span class="kbd">V</span> selecionar · <span class="kbd">R</span> gira · <span class="kbd">Del</span> exclui · <span class="kbd">Ctrl+Z</span> desfaz</p>`);
}

function builder(project, sheetNames = ['Folha 1']) {

  const C = (type, x, y, tag, extra = {}) => { const c = { id: 'c' + (n++), type, x, y, rot: 0, tag, sheet, ...extra }; if (type === 'fase') c.phase = c.phase || 'L1'; d.comps.push(c); return c; };
  const W = (a, ta, b, tb, color = RED, pts = []) => d.wires.push({ id: 'w' + (n++), a: { c: a.id, t: ta }, b: { c: b.id, t: tb }, color, pts });

}
